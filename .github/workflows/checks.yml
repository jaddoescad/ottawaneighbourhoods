name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoring-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scoring checks (config, data integrity, label/tier consistency, validation)
        run: node scripts/check-scoring.js

      - name: Scoring docs in sync with config
        run: node scripts/generate-scoring-docs.js --check

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
